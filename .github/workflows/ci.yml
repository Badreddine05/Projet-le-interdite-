name: Java rules and browser parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: chmod +x mvnw && ./mvnw -B -Pweb verify
      - run: npm test
      - name: Native Swing smoke
        run: xvfb-run -a java -cp target/classes:target/test-classes fr.badreddine.island.DesktopSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: island-web
          path: web/
      - uses: actions/upload-artifact@v4
        with:
          name: island-desktop
          path: target/ile-interdite-2.0.0.jar
